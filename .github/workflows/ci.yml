name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate public documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          blocked = ('roadmap', 'todo', '计划', '规划', '未来方案')
          for path in Path('.').rglob('*.md'):
              data = path.read_bytes()
              if data.startswith(b'\xef\xbb\xbf'):
                  raise SystemExit(f'UTF-8 BOM is not allowed: {path}')
              text = data.decode('utf-8')
              lowered = text.lower()
              for term in blocked:
                  if term in lowered:
                      raise SystemExit(f'Non-public planning term {term!r} in {path}')
          PY
