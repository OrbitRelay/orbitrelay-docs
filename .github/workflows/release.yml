name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar --exclude=.git --exclude=.github -czf "orbitrelay-docs-${GITHUB_REF_NAME}.tar.gz" .
      - run: gh release create "$GITHUB_REF_NAME" "orbitrelay-docs-${GITHUB_REF_NAME}.tar.gz" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
